<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="userSupport.css">
</head>
<body>
    <header>
        <img src="assets/logoPokénie_2.png" alt="Pokénie logo">
        <h1>Pokénie</h1>
        <h3>A successor to the Pokédex... and better</h3>
        <nav>
            <a href="./index.html">Home</a>
            <a href="">Search Pokémons</a>
            <a href="">My Favorites</a>
            <a href="userSupport.html">User Support</a>
            <a href="./login.html">Login</a>
            <a href="./register.html">Register</a>
        </nav>
    </header>
    <main>
    <h1>User Support</h1>
    <form>
        <label for="nome">Name:</label><br>
        <div class="field">
        <input id="nome" type="text" maxlength="30" placeholder="Insert your real name..." required>
        </div>
        <label for="email">Email:</label><br>
        <div class="field">
        <input id="email" type="email" placeholder="Insert your email. Ex: myemail@address.com" required>
        </div>
        <label for="numero_telefone">Phone number:</label><br>
        <div class="field">
        <input id="numero_telefone" type="tel" maxlength="15" placeholder="Insert your phone number..." required>
        </div>
        <label for="box1">The information i provided above is legitimate.</label>
        <input id="box1" type="checkbox" required><br>
        
        <label for="comentarios">Comments:</label><br>
        <div class="field">
        <textarea id="comentarios" maxlength="4000" placeholder="Describe your thoughts, opinions or feedbacks..." required></textarea>
        </div>

        <div class="container">
        <input type="submit" value="Submit"> 
        <input type="reset" value="Clear All">
        </div>
    </form>
</main>
    <footer>
        &copy; 2026 The Pokénie Association. All rights reserved.
    </footer>
</body>
</html>
