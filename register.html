<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="logoPokénie_2.png" alt="Pokénie logo">
        <h1>The Pokénie Association</h1>
        
    </header>
    <main>
        <div>

        <div class="welcome"><h1>Welcome Back,</h1> <h2>The Pokénie Association</h2></div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Insert your email" required>
        </div>
        <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="Insert your password" required> 
        </div>
        <button onclick="fazerLogin()">Entrar</button>
        <p id="mensagem"></p>
        </div>
    </main>
    <footer>
        &copy; 2026 Pokénie. All rights reserved.
    </footer>
</body>
</html>
