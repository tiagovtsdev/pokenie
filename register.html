<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logopokenie">
            <img src="assets/logoPokénie_2.png" alt="Pokénie logo">
        </div>
        <nav class="menu">
            <a href="">Search Pokémons</a>
            <a href="">My Favorites</a>
            <a href="./userSupport.html">User Support</a>
            <a href="./login.html">Login</a>
            <a href="./register.html">Register</a>
        </nav>
    </header>
    <main>
        <div>
            <div class="welcome">
                <h1>Create your account!</h1>
            </div>
            <div class="welcome">
                <h3>Discovery and save to your pokémons when creating your account.</h3>
            </div>
            <div class="field">
                <label for="nome">Nickname: </label><br>
                <input id="nome" type="text" maxlength="30" placeholder="Insert your name..." required>
            </div>
            <div class="field">
                <label for="email">Email: </label><br>
                <input id="email" type="email" placeholder="Insert your email..." required>
            </div>
            <div class="field">
                <label for="senha">Password: </label><br>
                <input id="senha" type="password" placeholder="Insert your password..." required>
                <button type="button" id="toggleSenha">Show</button>

                <script>
                    const campoSenha = document.getElementById('senha');
                    const botaoToggle = document.getElementById('toggleSenha');

                    botaoToggle.addEventListener('click', function() {
                        if (campoSenha.type === 'password') {
                            campoSenha.type = 'text';
                            botaoToggle.textContent = 'Hide';
                        } else {
                            campoSenha.type = 'password';
                            botaoToggle.textContent = 'Show';
                        }
                    })
                </script>
            </div>
            <div class="field">
                <label for="telefone">Phone: </label><br>
                <input id="telefone" type="tel" maxlength="15" placeholder="Insert your phone number..." required> 
            </div>
            <div class="field">
                <label for="nascimento">Date of Birth: </label><br>
                <input id="nascimento" type="date" required>
            </div>
            <div class="field">
                <label for="verificacao">I have read and accept all the terms and conditions of the Pokénie Association.</label><br>
                <input id="verificacao" type="checkbox" required><br>
            </div>
            <div class="field">
            <button onclick="fazerLogin()">Create now</button>
            <p id="mensagem"></p>
            </div>
        </div>
    </main>
    <footer class="copyright">
        &copy; 2026 The Pokénie Association. All rights reserved.
    </footer>
</body>
</html>
