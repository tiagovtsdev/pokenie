<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="register.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="logoPokénie_2.png" alt="Pokénie logo">
        <h1>Pokénie</h1>
        <h3>A successor to the Pokédex... and better</h3>
        <nav>
            <a href="./index.html">Home</a>
            <a href="">Search Pokémons</a>
            <a href="">My Favorites</a>
            <a href="./userSupport.html">User Support</a>
            <a href="./login.html">Login</a>
            <a href="./register.html">Register</a>
        </nav>
    </header>
    <main>
        <div>
            <div class="welcome">
                <h1>Create your account!</h1>
            </div>
            <div class="welcome">
                <h3>Discovery and save to your pokémons when creating your account.</h3>
            </div>
            <div class="field">
                <label for="nome">Nickname: </label>
                <input id="nome" type="text" maxlength="30" placeholder="Insert your name" required>
            </div>
            <div class="field">
                <label for="email">Email: </label>
                <input id="email" type="email" placeholder="Insert your email" required>
            </div>
            <div class="field">
                <label for="senha">Passowrd: </label>
                <input id="senha" type="password" placeholder="Insert your password" required> 
            </div>
            <div class="field">
            <button onclick="fazerLogin()">Create now</button>
            <p id="mensagem"></p>
            </div>
        </div>
    </main>
    <footer>
        &copy; 2026 The Pokénie Association. All rights reserved.
    </footer>
</body>
</html>
