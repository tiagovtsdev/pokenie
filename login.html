<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="icon"><img src="favicon.ico" alt="Pokénie logo"></div>
        <h1>Pokénie</h1>
        <h3>A successor to the Pokédex... and better</h3>
    </header>
    <main>
        <div class="login">
        <div class="welcome"><h1>Welcome Back, Poke fan!</div>
            <div class="field">
                <label for="email">Email: </label>
                <input id="email" type="email" placeholder="Insert your email" required>
            </div>
            <div class="field">
                <label for="senha">Password: </label>
                <input id="senha" type="password" placeholder="Insert your password" required>
            </div>
            <div class="field">
                <button onclick="fazerLogin()">Enter</button>
                
            </div>
            <div class="field"><h4><a href="./userSupport.html" class="forgot_password">Forgot my password</a></h4>
            </div>
        </div>
    </main>
    <footer>
        &copy; 2026 The Pokénie Association. All rights reserved.
    </footer>
</body>
</html>
