<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logopokenie">
            <img src="assets/logoPokénie_2.png" alt="Pokénie logo">
        </div>
        
        <h3>A successor to the Pokédex... and better</h3>
        <nav class="menu">
            <a href="./index.html">Home</a>
            <a href="">Search Pokémons</a>
            <a href="">My Favorites</a>
            <a href="./userSupport.html">User Support</a>
            <a href="./register.html">Register</a>
        </nav>
    </header>
    <main>
        <form>
            <div class="login">
            <div class="icon"><img src="assets/favicon.ico" alt="Pokénie logo"></div>
            <div class="welcome"><h1 id="welcome">Loading...</h1></div>
            <script>
                const data = new Date();
                const hora = data.getHours();
                const elemento = document.getElementById('welcome');

                if (hora >= 6 && hora < 12) {
                    elemento.innerHTML = "Good Morning!";
                } else if (hora >= 12 && hora < 18) {
                    elemento.innerHTML = "Good Afternoon!";
                } else {
                    elemento.innerHTML = "Good Night!"
                }
            </script>
            <p class="signup-text">Don't have an account yet? <a class="signup-link" href="./register.html">Sign Up</a></p>
                <div class="field">
                    <label for="email">Email: </label>
                    <input id="email" type="email" placeholder="Email" required>
                </div>
                <div class="field">
                    <label for="senha">Password: </label>
                    <div class="password-wrapper">
                        <input id="senha" type="password" placeholder="Password" required>
                        <img src="assets/hide.png" id="toggleSenha" class="toggleSenha" alt="Show Password">
                    </div>
                    <script>
                        const campoSenha = document.getElementById('senha');
                        const botaoToggle = document.getElementById('toggleSenha');

                        botaoToggle.addEventListener('click', function() {
                            if (campoSenha.type === 'password') {
                                campoSenha.type = 'text';
                                botaoToggle.src = 'assets/show.png';
                                botaoToggle.alt = 'Hide Password';
                            } else {
                                campoSenha.type = 'password';
                                botaoToggle.src = 'assets/hide.png';
                                botaoToggle.alt = 'Show Password';
                            }
                        })
                    </script>
                </div>
            <button type="submit" class="entra">Enter</button>
            <div class="forgot-field">
                <h4><a href="./userSupport.html" class="forgot_password">Forgot my password</a></h4>
            </div>
        </div>
        </form>
    </main>
    <footer class="copyright">
        &copy; 2026 The Pokénie Association. All rights reserved.
    </footer>
</body>
</html>
